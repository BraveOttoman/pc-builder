<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>RigForge — 3D PC Builder</title>
    <meta name="description" content="Build a PC in 3D: pick parts, check compatibility and power, and watch your rig assemble with live ARGB lighting.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='3' width='16' height='26' rx='3' fill='%2305070c' stroke='%2329e0ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='21' r='3.5' fill='none' stroke='%23ff3df0' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body data-sheet="parts">
    <canvas id="stage" aria-label="3D view of your PC build"></canvas>
    <div class="fx fx-vignette"></div>
    <div class="fx fx-scan"></div>
    <div class="fx fx-cursor" id="cursorGlow"></div>

    <div id="loader">
        <div class="loader-core">
            <div class="loader-logo" data-text="RIGFORGE">RIG<span>FORGE</span></div>
            <div class="loader-bar"><i></i></div>
            <div class="loader-msg">Initializing forge…</div>
        </div>
    </div>

    <header class="topbar">
        <div class="brand"><span class="brand-mark"></span>RIG<b>FORGE</b></div>
        <label class="build-name-wrap">
            <span class="sr">Build name</span>
            <input class="build-name" id="buildName" value="My Rig" maxlength="32" spellcheck="false">
        </label>
        <div class="tools">
            <button class="tool" data-act="power" aria-pressed="false" title="Power on / off (P)">
                <svg viewBox="0 0 24 24"><path d="M12 2.5v9"/><path d="M5.6 6.4a8.5 8.5 0 1 0 12.8 0"/></svg><span>Power</span>
            </button>
            <button class="tool" data-act="explode" aria-pressed="false" title="Exploded view (E)">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M19 19l-2.5-2.5M5 19l2.5-2.5M19 5l-2.5 2.5"/></svg><span>Explode</span>
            </button>
            <button class="tool" data-act="orbit" aria-pressed="true" title="Auto-orbit when idle (R)">
                <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v5h-5"/></svg><span>Orbit</span>
            </button>
            <button class="tool" data-act="view" title="Overview camera (V)">
                <svg viewBox="0 0 24 24"><path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5"/><circle cx="12" cy="12" r="3"/></svg><span>View</span>
            </button>
            <button class="tool" data-act="sound" aria-pressed="true" title="Sound (M)">
                <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Sound</span>
            </button>
            <button class="tool accent" data-act="share" title="Copy a link to this build">
                <svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg><span>Share</span>
            </button>
        </div>
    </header>

    <aside class="panel parts-panel" aria-label="Parts">
        <nav class="rail" id="rail"></nav>
        <section class="drawer">
            <header class="drawer-head">
                <div>
                    <div class="eyebrow" id="drawerEyebrow">01 / 09</div>
                    <h2 id="drawerTitle">Processor</h2>
                </div>
                <button class="ghost-btn" id="removeBtn" hidden>Remove</button>
            </header>
            <div class="sorter" role="group" aria-label="Sort parts">
                <button data-sort="price" class="on">Price</button>
                <button data-sort="perf">Performance</button>
            </div>
            <div class="part-list" id="partList"></div>
        </section>
    </aside>

    <aside class="panel summary-panel" aria-label="Build summary">
        <section class="sum-head">
            <div class="eyebrow">Build total</div>
            <div class="total"><span class="cur">$</span><span id="total">0</span></div>
            <div class="status-line" id="statusLine">—</div>
        </section>

        <section class="sum-grid">
            <div class="gauge-card">
                <svg viewBox="0 0 120 70" class="gauge">
                    <path class="g-track" d="M10 62 A50 50 0 0 1 110 62" pathLength="100"/>
                    <path class="g-fill" id="gaugeFill" d="M10 62 A50 50 0 0 1 110 62" pathLength="100"/>
                </svg>
                <div class="gauge-read"><b id="watts">0</b><small>W est.</small></div>
                <div class="gauge-sub" id="psuLine">No PSU</div>
            </div>
            <div class="perf-card">
                <div class="eyebrow">Est. FPS · AAA high</div>
                <div class="fps" id="fps"></div>
                <div class="bneck" id="bneck"></div>
            </div>
        </section>

        <section class="block">
            <div class="block-title">Compatibility</div>
            <ul class="issues" id="issues"></ul>
        </section>

        <section class="block">
            <div class="block-title">Lighting <span class="hint-inline">ARGB sync</span></div>
            <div class="swatches" id="swatches"></div>
            <div class="modes" id="modes"></div>
        </section>

        <section class="block">
            <div class="block-title">Quick builds</div>
            <div class="presets" id="presets"></div>
        </section>

        <section class="block">
            <div class="block-title">Parts list</div>
            <ul class="bom" id="bom"></ul>
        </section>
    </aside>

    <div class="hint" id="hint">Drag to orbit · Scroll to zoom · Click any part · <kbd>E</kbd> explode · <kbd>P</kbd> power</div>
    <div id="tooltip" role="status"></div>
    <div id="toasts" aria-live="polite"></div>

    <nav class="mobile-tabs">
        <button data-sheet="parts">Parts</button>
        <button data-sheet="none">3D View</button>
        <button data-sheet="summary">Build</button>
    </nav>

    <script type="module" src="js/main.js"></script>
</body>
</html>
